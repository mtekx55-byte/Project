<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Prijava</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="/Pocetak/HTML/CSS/prijava.css" />
  </head>

  <body>
    <div class="login-box">
      <!-- spremnik koji centrira i drži elemente forme na okupu -->
      <div class="login-header">

        <!-- Zaglavlje forme s ikonom i naslovom -->
        <i class="bi bi-person-circle"></i>
        
        <!-- Ikona korisnika -->
        <h2>Prijava</h2>
      </div>

      <form>
        <div class="mb-3">
          <label class="form-label"> Korisničko ime </label>
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Unesite korisničko ime"
          />
        </div>

        <div class="mb-3">
          <label class="form-label"> Lozinka </label>

          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Unesite lozinku"
          />
        </div>

        <button type="submit" class="btn btn-dark w-100">Prijavi se</button>
      </form>

      <div class="login-footer">
        Nemaš račun?

        <a href="registracija.html"> Registriraj se </a>
      </div>
    </div>

    <script src="/Pocetak/HTML/JS/prijava.js"></script>
  </body>
</html>
