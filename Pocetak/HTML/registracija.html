<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Omogućuje prikaz hrvatskih znakova (č, ć, ž, š, đ) -->

    <title>Registracija</title>
    <!-- Naslov koji se prikazuje na kartici preglednika -->

    <!-- Bootstrap CSS - gotovi stilovi -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons - biblioteka ikona -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Vlastita CSS datoteka -->
    <link rel="stylesheet" href="/Pocetak/HTML/CSS/registracija.css" />
  </head>

  <body>
    <!-- Glavni okvir registracijske forme -->
    <div class="forma-registracija">

      <!-- Zaglavlje forme -->
      <div class="register-header">

        <!-- Ikona registracije -->
        <i class="bi bi-person-plus"></i>

        <!-- Naslov forme -->
        <h2>Registracija</h2>

      </div>

      <!-- Početak forme -->
      <form id="forma-registracija">

        <!-- Polje za ime -->
        <div class="mb-3">
          <!-- mb-3 = Bootstrap razmak ispod elementa -->
           <!-- m znači margin, bottom (donji razmak), 3 znači veličina razmaka (predefinirana u Bootstrapu) -->

          <label class="form-label">Ime</label>
          <input
            type="text"
            class="form-control"
            placeholder="Unesite ime"/>
        </div>

        <!-- Polje za prezime -->
        <div class="mb-3">
          <label class="form-label">Prezime</label>
          <input
            type="text"
            class="form-control"
            placeholder="Unesite prezime"/>
        </div>

        <!-- Polje za korisničko ime -->
        <div class="mb-3">
          <label class="form-label">Korisničko ime</label>
          <input
            type="text"
            id="username"
            class="form-control"
            placeholder="Unesite korisničko ime"/>
        </div>

        <!-- Polje za email -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            placeholder="Unesite email"/>
        </div>

        <!-- Polje za lozinku -->
        <div class="mb-3">
          <label class="form-label">Lozinka</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="Unesite lozinku"/>
        </div>

        <!-- Polje za potvrdu lozinke -->
        <div class="mb-3">
          <label class="form-label">Ponovi lozinku</label>
          <input
            type="password"
            id="confirmPassword"
            class="form-control"
            placeholder="Ponovite lozinku"/>
        </div>

        <!-- Gumb za slanje forme -->
        <button
          type="submit"
          class="btn btn-dark w-100">
          Registriraj se
        </button>
      </form>

      <!-- Donji dio forme -->
      <div class="register-footer">
        Već imaš račun?
        <!-- Link na stranicu za prijavu -->
        <a href="prijava.html">Prijavi se</a>
      </div>
    </div>

    <!-- Povezivanje JavaScript datoteke -->
    <script src="/Pocetak/HTML/JS/registracija.js"></script>

  </body>
</html>
